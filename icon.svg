<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="pythonYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="96" fill="none" stroke="#334155" stroke-width="4" />

  <!-- Hydraulic Pipe Outline -->
  <path d="M 96 180 L 210 180 C 240 180 240 220 270 220 L 416 220" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" />
  <path d="M 96 332 L 210 332 C 240 332 240 292 270 292 L 416 292" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" />

  <!-- Active Water Stream Glowing -->
  <path d="M 96 180 L 210 180 C 240 180 240 256 280 256 L 416 256" fill="none" stroke="url(#waterGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />
  <path d="M 96 332 L 210 332 C 240 332 240 256 280 256" fill="none" stroke="url(#waterGrad)" stroke-width="16" stroke-linecap="round" filter="url(#glow)" />

  <!-- Valve A (Top) -->
  <circle cx="160" cy="180" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
  <circle cx="160" cy="180" r="10" fill="#38bdf8" />
  <line x1="160" y1="140" x2="160" y2="170" stroke="#facc15" stroke-width="6" stroke-linecap="round" />

  <!-- Valve B (Bottom) -->
  <circle cx="160" cy="332" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="6" />
  <circle cx="160" cy="332" r="10" fill="#38bdf8" />
  <line x1="160" y1="292" x2="160" y2="322" stroke="#facc15" stroke-width="6" stroke-linecap="round" />

  <!-- Water Drop / Logic Symbol in Center -->
  <path d="M 330 190 C 330 190 380 240 380 270 C 380 298 358 320 330 320 C 302 320 280 298 280 270 C 280 240 330 190 330 190 Z" fill="url(#waterGrad)" filter="url(#glow)" />
  <path d="M 315 260 Q 330 240 335 240 Q 340 255 330 275" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />

  <!-- Python Tech Node Indicators -->
  <circle cx="416" cy="256" r="18" fill="#facc15" stroke="#ffffff" stroke-width="4" filter="url(#glow)" />
  <text x="416" y="262" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle" fill="#0f172a">T</text>
</svg>
